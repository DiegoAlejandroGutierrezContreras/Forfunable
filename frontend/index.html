<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forfunable — Comunidades técnicas</title>
  <meta name="description" content="Foros y comunidades técnicas sobre Google Cloud Platform con Cloud Run y Cloud SQL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2313101c'/><path d='M28 32h44M28 50h30M28 68h14' stroke='%2300e676' stroke-width='9' stroke-linecap='round'/><circle cx='68' cy='68' r='6' fill='%2338bdf8'/></svg>">
</head>
<body>
  <!-- Avisos globales de conectividad y estado (Etapa 4) -->
  <div id="global-banners" class="sticky top-0 z-[60]"></div>

  <!-- Barra superior -->
  <header id="app-header" class="sticky top-0 z-50 h-16 border-b border-line bg-surface-card/90 backdrop-blur-xl">
    <div class="flex h-16 items-center justify-between gap-4 px-4 lg:px-6">
      <div class="flex items-center gap-2 lg:w-60">
        <button class="btn-icon lg:hidden" onclick="Router.toggleSidebar()" aria-label="Abrir menú"><span class="icon">menu</span></button>
        <a href="/" data-link class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded border border-line bg-surface-elevated">
            <svg viewBox="0 0 100 100" class="h-5 w-5"><path d="M24 30h52M24 50h34M24 70h16" stroke="#00e676" stroke-width="10" stroke-linecap="round"/><circle cx="70" cy="70" r="7" fill="#38bdf8"/></svg>
          </span>
          <span class="font-display text-headline-sm tracking-tight">Forfunable</span>
        </a>
      </div>

      <form class="relative hidden max-w-xl flex-1 md:block" onsubmit="event.preventDefault(); Router.navigate('/search?q=' + encodeURIComponent(this.q.value.trim()))">
        <span class="icon pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-ink-muted">search</span>
        <input name="q" id="header-search" class="input py-2 pl-10 pr-20 text-body-sm" placeholder="Buscar publicaciones, comunidades o usuarios..." autocomplete="off">
        <kbd class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 rounded border border-line bg-surface-elevated px-1.5 py-0.5 text-label-sm text-ink-secondary">Ctrl + K</kbd>
      </form>

      <div id="navbar-auth-actions" class="flex items-center justify-end gap-2">
        <div class="skeleton h-8 w-36"></div>
      </div>
    </div>
  </header>

  <div class="flex">
    <!-- Menú lateral -->
    <aside id="app-sidebar" class="fixed inset-y-0 left-0 top-16 z-40 hidden w-64 shrink-0 overflow-y-auto border-r border-line bg-surface-card lg:sticky lg:block lg:h-[calc(100vh-4rem)]">
      <div class="flex flex-col gap-5 p-4">
        <div class="flex flex-col gap-1">
          <span class="nav-section">Principal</span>
          <nav class="flex flex-col gap-0.5" id="sidebar-main-nav">
            <a href="/" data-link data-nav="/" class="nav-item"><span class="icon text-[19px]">dynamic_feed</span>Para ti</a>
            <a href="/communities" data-link data-nav="/communities" class="nav-item"><span class="icon text-[19px]">explore</span>Explorar</a>
            <a href="/search" data-link data-nav="/search" class="nav-item"><span class="icon text-[19px]">search</span>Buscar</a>
            <a href="/chat" data-link data-nav="/chat" class="nav-item justify-between"><span class="flex items-center gap-3"><span class="icon text-[19px]">chat_bubble_outline</span>Mensajes</span><span id="nav-chat-badge" class="chip-community hidden"></span></a>
            <a href="/notifications" data-link data-nav="/notifications" class="nav-item justify-between"><span class="flex items-center gap-3"><span class="icon text-[19px]">notifications_none</span>Notificaciones</span><span id="nav-notif-badge" class="chip-danger hidden"></span></a>
            <a href="/members" data-link data-nav="/members" class="nav-item"><span class="icon text-[19px]">leaderboard</span>Miembros</a>
          </nav>
        </div>

        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between px-2">
            <span class="nav-section px-0">Comunidades</span>
            <a href="/c/create" data-link class="text-ink-muted hover:text-ink" title="Crear comunidad"><span class="icon text-[18px]">add</span></a>
          </div>
          <nav id="sidebar-communities-list" class="flex flex-col gap-0.5">
            <div class="skeleton mx-3 my-1 h-4 w-32"></div>
            <div class="skeleton mx-3 my-1 h-4 w-24"></div>
          </nav>
        </div>

        <div id="sidebar-admin" class="hidden flex-col gap-1">
          <span class="nav-section">Gestión</span>
          <nav class="flex flex-col gap-0.5">
            <a href="/admin/reports" data-link data-nav="/admin/reports" class="nav-item"><span class="icon text-[19px]">shield</span>Moderación</a>
            <a href="/admin" data-link data-nav="/admin" class="nav-item"><span class="icon text-[19px]">admin_panel_settings</span>Administración</a>
          </nav>
        </div>
      </div>
    </aside>
    <div id="sidebar-scrim" class="fixed inset-0 top-16 z-30 hidden bg-black/50 lg:hidden" onclick="Router.toggleSidebar(false)"></div>

    <!-- Contenido -->
    <div class="min-w-0 flex-1">
      <div id="layout" class="mx-auto flex max-w-[1140px] items-start gap-5 px-4 py-4 lg:px-6">
        <main id="main-view-container" class="min-w-0 flex-1"></main>
        <aside id="app-rail" class="sticky top-20 hidden w-[300px] shrink-0 flex-col gap-4 xl:flex"></aside>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[110] flex max-w-sm flex-col gap-2"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/views/auth.js"></script>
  <script src="/static/js/views/feed.js"></script>
  <script src="/static/js/views/postDetail.js"></script>
  <script src="/static/js/views/createPost.js"></script>
  <script src="/static/js/views/community.js"></script>
  <script src="/static/js/views/createCommunity.js"></script>
  <script src="/static/js/views/communityAdmin.js"></script>
  <script src="/static/js/views/search.js"></script>
  <script src="/static/js/views/members.js"></script>
  <script src="/static/js/views/profile.js"></script>
  <script src="/static/js/views/settings.js"></script>
  <script src="/static/js/views/notifications.js"></script>
  <script src="/static/js/views/chat.js"></script>
  <script src="/static/js/views/moderation.js"></script>
  <script src="/static/js/views/admin.js"></script>
  <script src="/static/js/views/status.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
